<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ffffff">
  <title>Al Ilmi LMS - Materi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="manifest" href="manifest.json">
  <!-- PWA Handler -->
  <script src="pwa-handler.js"></script>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* HEADER */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: white;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg-color);
    }

    .header-title {
      flex: 1;
      text-align: center;
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 10px;
    }

    /* VIEW AREA */
    .viewer {
      position: fixed;
      top: 60px;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-color);
      transition: all 0.3s ease;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    .viewer:fullscreen {
      top: 0;
      bottom: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    /* ANIMASI LOADING */
    .loader-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* ============================================================
       STIL VIDEO INTERAKTIF (IN-VIDEO QUIZ)
       ============================================================ */
    .interactive-video-wrapper {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
    }

    .iv-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 0.85rem;
    }

    .iv-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .iv-player-box {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      border-radius: 14px;
      overflow: hidden;
      background: #0f172a;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
    }

    .iv-player-box iframe, 
    .iv-player-box #ivYtPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .iv-click-blocker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      background: rgba(15, 23, 42, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: not-allowed;
    }

    .iv-checkpoints-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 18px;
      margin-top: 16px;
      box-shadow: var(--shadow-sm);
    }

    .iv-cp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .iv-cp-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .iv-cp-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
      border: 1px solid var(--border-color);
      background: #f8fafc;
      color: var(--text-main);
      transition: all 0.2s;
    }

    .iv-cp-pill.completed {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
      font-weight: 600;
    }

    .iv-cp-pill.active {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
      font-weight: 600;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    /* Modal Overlay Kuis Video */
    .iv-quiz-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .iv-quiz-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
    }

    .iv-quiz-dialog {
      position: relative;
      width: 100%;
      max-width: 540px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: ivPopIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes ivPopIn {
      0% { transform: scale(0.94); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .iv-quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background: #f8fafc;
    }

    .iv-quiz-step-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #2563eb;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .iv-quiz-number {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      background: #e2e8f0;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .iv-quiz-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .iv-question-text {
      margin: 0 0 16px 0;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.5;
    }

    .iv-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .iv-option-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .iv-option-item:hover {
      border-color: #93c5fd;
      background: #f8fafc;
    }

    .iv-option-item.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .iv-option-item.correct-reveal {
      border-color: #22c55e;
      background: #f0fdf4;
    }

    .iv-option-item.wrong-reveal {
      border-color: #ef4444;
      background: #fef2f2;
    }

    .iv-option-key {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #475569;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: 0.2s;
      border: 1px solid var(--border-color);
    }

    .iv-option-item.selected .iv-option-key {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .iv-option-item.correct-reveal .iv-option-key {
      background: #22c55e;
      color: white;
      border-color: #22c55e;
    }

    .iv-option-item.wrong-reveal .iv-option-key {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
    }

    .iv-option-text {
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--text-main);
      flex: 1;
    }

    .iv-feedback-box {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      animation: fadeIn 0.3s ease;
    }

    .iv-feedback-box.correct {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #166534;
    }

    .iv-feedback-box.wrong {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .iv-feedback-alert {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 4px;
    }

    .iv-feedback-desc {
      margin: 4px 0 0 0;
      font-size: 0.84rem;
      line-height: 1.45;
      color: inherit;
    }

    .iv-quiz-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
      background: #f8fafc;
    }

    .iv-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    .iv-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .iv-btn-outline {
      background: white;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .iv-btn-outline:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .iv-btn-primary {
      background: var(--primary);
      color: white;
    }

    .iv-btn-primary:hover {
      background: #1d4ed8;
    }

    .iv-btn-success {
      background: #16a34a;
      color: white;
    }

    .iv-btn-success:hover {
      background: #15803d;
    }

    .iv-toast {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: white;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 500;
      z-index: 10000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      animation: ivToastIn 0.3s ease;
      white-space: nowrap;
    }

    @keyframes ivToastIn {
      0% { transform: translate(-50%, -15px); opacity: 0; }
      100% { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="icon-btn" onclick="back()">
    <i data-lucide="arrow-left"></i>
  </button>

  <div class="header-title" id="displayJudul">Memuat Materi...</div>

  <button class="icon-btn" onclick="toggleFullscreen()" title="Fullscreen">
    <i data-lucide="maximize" id="fsIcon"></i>
  </button>
</div>

<div class="viewer" id="materiList">
  <div class="loader-container">
    <div class="loader"></div>
    <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">Memuat...</div>
  </div>
</div>

<script>
  lucide.createIcons();
  const userDataForAPI = JSON.parse(localStorage.getItem('user') || '{}');
  const myTingkatAPI = (userDataForAPI.tingkat || userDataForAPI.Tingkat || "X").toString().trim().toUpperCase();
  const API_URL = `https://script.google.com/macros/s/AKfycbx8dBNFIqvVixZ5ORodulJYxqjtMvjr-Qajjez1uD7UIeq-ypSI1xaNjdUtJkq3ovzsbw/exec?sheet=materi`;

  if (!localStorage.getItem("user")) {
    window.location.href = "index.html";
  }

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  // FUNGSI FULLSCREEN
  function toggleFullscreen() {
    const viewer = document.querySelector('.viewer');
    const icon = document.getElementById('fsIcon');

    if (!document.fullscreenElement) {
      if (viewer.requestFullscreen) {
        viewer.requestFullscreen();
      } else if (viewer.webkitRequestFullscreen) { /* Safari */
        viewer.webkitRequestFullscreen();
      } else if (viewer.msRequestFullscreen) { /* IE11 */
        viewer.msRequestFullscreen();
      }
      const iconContainer = icon.parentNode;
      iconContainer.innerHTML = '<i data-lucide="minimize" id="fsIcon"></i>';
      lucide.createIcons();
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
      const iconContainer = icon.parentNode;
      iconContainer.innerHTML = '<i data-lucide="maximize" id="fsIcon"></i>';
      lucide.createIcons();
    }
  }

  document.addEventListener('fullscreenchange', (event) => {
    const icon = document.getElementById('fsIcon');
    const iconContainer = icon.parentNode;
    if (!document.fullscreenElement) {
      iconContainer.innerHTML = '<i data-lucide="maximize" id="fsIcon"></i>';
    } else {
      iconContainer.innerHTML = '<i data-lucide="minimize" id="fsIcon"></i>';
    }
    lucide.createIcons();
  });

  const getVal = (obj, possibleKeys) => {
    if (!obj) return undefined;
    for (const key in obj) {
      const normKey = key.toLowerCase().replace(/[^a-z0-9]/g, '');
      for (const p of possibleKeys) {
        if (normKey === p.toLowerCase().replace(/[^a-z0-9]/g, '')) return obj[key];
      }
    }
    return undefined;
  };

  function extractYouTubeId(url) {
    if (!url) return null;
    const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  function formatDetik(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = Math.floor(totalSeconds % 60);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function showIvToast(msg) {
    let oldToast = document.querySelector('.iv-toast');
    if (oldToast) oldToast.remove();
    const toast = document.createElement('div');
    toast.className = 'iv-toast';
    toast.innerHTML = `<i data-lucide="alert-circle" style="width:16px;height:16px;color:#f59e0b;"></i> <span>${msg}</span>`;
    document.body.appendChild(toast);
    if (window.lucide) lucide.createIcons();
    setTimeout(() => {
      toast.style.transition = 'opacity 0.3s ease';
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 3500);
  }

  // Variabel Global Video Interaktif
  let ivPlayer = null;
  let ivTrackingInterval = null;
  let ivActiveCp = null;
  let ivLastCp = null;
  let ivSelectedOptIdx = null;
  let ivMaxWatchedTime = 0;
  let ivAnsweredSet = new Set();
  let ivKuisList = [];

  function renderInteractiveYouTube(m, videoId, kuisList) {
    const container = document.getElementById("materiList");
    if (!container) return;

    // Sortir urutan soal berdasarkan detik terendah
    ivKuisList = kuisList.map(item => ({
      ...item,
      detik: parseFloat(item.detik || item.waktu || 0)
    })).sort((a, b) => a.detik - b.detik);

    ivAnsweredSet = new Set();
    ivMaxWatchedTime = 0;
    ivActiveCp = null;
    ivLastCp = null;
    ivSelectedOptIdx = null;

    container.innerHTML = `
      <div class="interactive-video-wrapper">
        <div class="iv-banner">
          <span class="iv-badge"><i data-lucide="sparkles" style="width:14px;height:14px;"></i> Video Interaktif</span>
          <span class="iv-info" style="font-weight:500;">Perhatikan video dengan seksama! Terdapat <b>${ivKuisList.length}</b> pertanyaan pemahaman di menit-menit tertentu.</span>
        </div>

        <div class="iv-player-box" id="ivPlayerBox">
          <div id="ivYtPlayer"></div>
          <div id="ivClickBlocker" class="iv-click-blocker" style="display:none;"></div>
        </div>

        <div class="iv-checkpoints-card">
          <div class="iv-cp-header">
            <span style="display:flex; align-items:center; gap:6px;">
              <i data-lucide="check-square" style="width:16px;height:16px;color:var(--primary);"></i> Titik Pertanyaan Pemahaman
            </span>
            <span id="ivProgressStatus" style="color:var(--primary); font-weight:700;">0/${ivKuisList.length} Selesai</span>
          </div>
          <div class="iv-cp-list" id="ivCpList">
            ${ivKuisList.map((cp, idx) => `
              <div class="iv-cp-pill" id="cpPill_${idx}">
                <i data-lucide="clock" style="width:13px;height:13px;"></i>
                <span>Menit ${formatDetik(cp.detik)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <!-- MODAL KUIS VIDEO OVERLAY -->
      <div id="ivQuizModal" class="iv-quiz-modal" style="display:none;">
        <div class="iv-quiz-backdrop"></div>
        <div class="iv-quiz-dialog">
          <div class="iv-quiz-header">
            <div class="iv-quiz-step-badge">
              <i data-lucide="help-circle" style="width:18px;height:18px;"></i>
              <span id="ivQuizDetikBadge">Menit 00:00</span>
            </div>
            <span class="iv-quiz-number" id="ivQuizNumber">Pertanyaan 1</span>
          </div>

          <div class="iv-quiz-body">
            <h4 id="ivQuizQuestion" class="iv-question-text">Pertanyaan...</h4>
            <div id="ivQuizOptions" class="iv-options-list"></div>

            <div id="ivFeedbackBox" class="iv-feedback-box" style="display:none;">
              <div id="ivFeedbackAlert" class="iv-feedback-alert">
                <i id="ivFeedbackIcon" data-lucide="check-circle" style="width:18px;height:18px;"></i>
                <span id="ivFeedbackMsg">Jawaban Anda Benar!</span>
              </div>
              <p id="ivFeedbackDesc" class="iv-feedback-desc"></p>
            </div>
          </div>

          <div class="iv-quiz-footer">
            <button id="ivBtnRewind" type="button" class="iv-btn iv-btn-outline" onclick="ivRewind(15)">
              <i data-lucide="rotate-ccw" style="width:15px;height:15px;"></i> Ulangi 15 Detik
            </button>
            <button id="ivBtnSubmit" type="button" class="iv-btn iv-btn-primary" onclick="ivCheckAnswer()" disabled>
              Periksa Jawaban
            </button>
            <button id="ivBtnResume" type="button" class="iv-btn iv-btn-success" style="display:none;" onclick="ivResumeVideo()">
              Lanjutkan Menonton <i data-lucide="play" style="width:15px;height:15px;"></i>
            </button>
          </div>
        </div>
      </div>
    `;

    // Pasang handler langsung pada tombol
    const btnRewind = document.getElementById('ivBtnRewind');
    if (btnRewind) btnRewind.onclick = () => ivRewind(15);
    const btnSubmit = document.getElementById('ivBtnSubmit');
    if (btnSubmit) btnSubmit.onclick = () => ivCheckAnswer();
    const btnResume = document.getElementById('ivBtnResume');
    if (btnResume) btnResume.onclick = () => ivResumeVideo();

    if (window.lucide) lucide.createIcons();

    // Inisialisasi YouTube Player
    setupYouTubePlayer(videoId);
  }

  function setupYouTubePlayer(videoId) {
    if (ivPlayer && typeof ivPlayer.destroy === 'function') {
      try { ivPlayer.destroy(); } catch(e){}
    }

    function initPlayerInstance() {
      if (!window.YT || !window.YT.Player) {
        setTimeout(initPlayerInstance, 150);
        return;
      }

      ivPlayer = new YT.Player('ivYtPlayer', {
        videoId: videoId,
        playerVars: {
          'playsinline': 1,
          'rel': 0,
          'modestbranding': 1,
          'enablejsapi': 1,
          'fs': 1
        },
        events: {
          'onReady': onIvReady,
          'onStateChange': onIvStateChange
        }
      });
    }

    initPlayerInstance();
  }

  function onIvReady(event) {
    console.log("YouTube Player Interactive Siap.");
  }

  function onIvStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      // Jika kuis sedang aktif terbuka, paksa pause kembali
      if (ivActiveCp) {
        ivPlayer.pauseVideo();
        return;
      }
      startIvTracking();
    } else {
      stopIvTracking();
    }
  }

  function startIvTracking() {
    stopIvTracking();
    ivTrackingInterval = setInterval(() => {
      if (!ivPlayer || typeof ivPlayer.getCurrentTime !== 'function') return;
      const curTime = ivPlayer.getCurrentTime();

      // 1. Anti-Skip: Cegah siswa melompati soal yang belum dikerjakan
      if (curTime > ivMaxWatchedTime + 2.5) {
        const skippedCp = ivKuisList.find(cp => 
          cp.detik > (ivMaxWatchedTime + 1) && 
          cp.detik <= curTime && 
          !ivAnsweredSet.has(cp.detik)
        );

        if (skippedCp) {
          ivPlayer.seekTo(ivMaxWatchedTime, true);
          showIvToast("⚠️ Selesaikan pertanyaan pemahaman terlebih dahulu sebelum melanjutkan!");
          return;
        }
      }

      if (curTime > ivMaxWatchedTime) {
        ivMaxWatchedTime = curTime;
      }

      // 2. Deteksi Checkpoint Soal
      const targetCp = ivKuisList.find(cp => 
        Math.abs(curTime - cp.detik) <= 0.75 && 
        !ivAnsweredSet.has(cp.detik)
      );

      if (targetCp) {
        triggerIvQuiz(targetCp);
      }
    }, 300);
  }

  function stopIvTracking() {
    if (ivTrackingInterval) {
      clearInterval(ivTrackingInterval);
      ivTrackingInterval = null;
    }
  }

  function triggerIvQuiz(cp) {
    stopIvTracking();
    ivActiveCp = cp;
    ivLastCp = cp;
    ivSelectedOptIdx = null;

    if (ivPlayer && typeof ivPlayer.pauseVideo === 'function') {
      try { ivPlayer.pauseVideo(); } catch(e){}
    }

    // Tampilkan click blocker di atas video agar siswa tidak memencet play di video
    const blocker = document.getElementById('ivClickBlocker');
    if (blocker) blocker.style.display = 'block';

    // Setup konten modal kuis
    const idx = ivKuisList.indexOf(cp);
    const badge = document.getElementById('ivQuizDetikBadge');
    if (badge) badge.innerText = `Menit ${formatDetik(cp.detik)}`;
    const qNum = document.getElementById('ivQuizNumber');
    if (qNum) qNum.innerText = `Pertanyaan ${idx + 1} dari ${ivKuisList.length}`;
    const qText = document.getElementById('ivQuizQuestion');
    if (qText) qText.innerText = cp.soal || cp.pertanyaan || "Jawab pertanyaan berikut:";

    // Highlight active pill
    const pill = document.getElementById(`cpPill_${idx}`);
    if (pill) pill.classList.add('active');

    // Render opsi pilihan ganda
    const optsContainer = document.getElementById('ivQuizOptions');
    if (optsContainer) {
      optsContainer.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D', 'E'];
      const choices = cp.pilihan || cp.opsi || [];

      choices.forEach((optText, optIdx) => {
        const item = document.createElement('div');
        item.className = 'iv-option-item';
        item.dataset.index = optIdx;
        item.onclick = () => ivSelectOption(optIdx);
        item.innerHTML = `
          <div class="iv-option-key">${letters[optIdx] || (optIdx + 1)}</div>
          <div class="iv-option-text">${optText}</div>
        `;
        optsContainer.appendChild(item);
      });
    }

    // Reset feedback & buttons
    const fbBox = document.getElementById('ivFeedbackBox');
    if (fbBox) {
      fbBox.style.display = 'none';
      fbBox.className = 'iv-feedback-box';
    }

    const btnSubmit = document.getElementById('ivBtnSubmit');
    if (btnSubmit) {
      btnSubmit.style.display = 'inline-flex';
      btnSubmit.disabled = true;
      btnSubmit.onclick = () => ivCheckAnswer();
    }

    const btnResume = document.getElementById('ivBtnResume');
    if (btnResume) {
      btnResume.style.display = 'none';
      btnResume.onclick = () => ivResumeVideo();
    }

    const btnRewind = document.getElementById('ivBtnRewind');
    if (btnRewind) {
      btnRewind.style.display = 'inline-flex';
      btnRewind.onclick = () => ivRewind(15);
    }

    // Tampilkan Modal
    const modal = document.getElementById('ivQuizModal');
    if (modal) modal.style.display = 'flex';

    if (window.lucide) lucide.createIcons();
  }

  function ivSelectOption(optIdx) {
    const cp = ivActiveCp || ivLastCp;
    // Jika kuis sudah dijawab benar, tidak bisa ganti
    if (cp && ivAnsweredSet.has(cp.detik)) return;

    ivSelectedOptIdx = optIdx;
    const allItems = document.querySelectorAll('.iv-option-item');
    allItems.forEach(item => {
      if (parseInt(item.dataset.index) === optIdx) {
        item.classList.add('selected');
      } else {
        item.classList.remove('selected');
      }
    });

    const btnSubmit = document.getElementById('ivBtnSubmit');
    if (btnSubmit) btnSubmit.disabled = false;
  }

  function ivCheckAnswer() {
    if (ivSelectedOptIdx === null) {
      showIvToast("Pilih salah satu jawaban terlebih dahulu!");
      return;
    }
    const cp = ivActiveCp || ivLastCp;
    if (!cp) return;

    let isCorrect = false;

    // Normalisasi kunci jawaban (bisa integer index 0/1/2, huruf A/B/C/D, atau teks)
    let key = cp.jawaban !== undefined ? cp.jawaban : (cp.kunci !== undefined ? cp.kunci : 0);
    if (typeof key === 'string') {
      const letters = ['A', 'B', 'C', 'D', 'E'];
      let letterIdx = letters.indexOf(key.toUpperCase().trim());
      if (letterIdx !== -1) {
        key = letterIdx;
      } else if (!isNaN(parseInt(key))) {
        key = parseInt(key);
      } else {
        const choices = cp.pilihan || cp.opsi || [];
        let matchIdx = choices.findIndex(c => (c || "").toString().trim().toLowerCase() === key.trim().toLowerCase());
        if (matchIdx !== -1) key = matchIdx;
      }
    }

    isCorrect = (Number(ivSelectedOptIdx) === Number(key));

    const fbBox = document.getElementById('ivFeedbackBox');
    const fbIcon = document.getElementById('ivFeedbackIcon');
    const fbMsg = document.getElementById('ivFeedbackMsg');
    const fbDesc = document.getElementById('ivFeedbackDesc');
    const btnSubmit = document.getElementById('ivBtnSubmit');
    const btnResume = document.getElementById('ivBtnResume');

    const selectedItem = document.querySelector(`.iv-option-item[data-index="${ivSelectedOptIdx}"]`);

    if (isCorrect) {
      // TANDAI SUKSES
      ivAnsweredSet.add(cp.detik);
      if (fbBox) {
        fbBox.className = 'iv-feedback-box correct';
        fbBox.style.display = 'block';
      }
      if (fbMsg) fbMsg.innerText = "Luar Biasa, Jawaban Anda Benar!";
      if (fbDesc) fbDesc.innerText = cp.pembahasan || "Pemahaman Anda terhadap bagian materi ini sudah sangat baik. Lanjutkan menonton video.";

      if (selectedItem) {
        selectedItem.classList.remove('selected');
        selectedItem.classList.add('correct-reveal');
      }

      // Update Pill Checkpoint
      const cpIdx = ivKuisList.indexOf(cp);
      const pill = document.getElementById(`cpPill_${cpIdx}`);
      if (pill) {
        pill.className = 'iv-cp-pill completed';
        pill.innerHTML = `<i data-lucide="check-circle" style="width:13px;height:13px;color:#16a34a;"></i> <span>Menit ${formatDetik(cp.detik)} (Selesai)</span>`;
      }

      // Update progress badge
      const progStatus = document.getElementById('ivProgressStatus');
      if (progStatus) {
        progStatus.innerText = `${ivAnsweredSet.size}/${ivKuisList.length} Selesai`;
        if (ivAnsweredSet.size === ivKuisList.length) {
          progStatus.innerHTML = `<span style="color:#16a34a;">Semua Pertanyaan Selesai! 🎉</span>`;
        }
      }

      if (btnSubmit) btnSubmit.style.display = 'none';
      if (btnResume) btnResume.style.display = 'inline-flex';
    } else {
      // JAWABAN BELUM TEPAT
      if (fbBox) {
        fbBox.className = 'iv-feedback-box wrong';
        fbBox.style.display = 'block';
      }
      if (fbMsg) fbMsg.innerText = "Jawaban Belum Tepat";
      if (fbDesc) fbDesc.innerText = "Coba pilih jawaban lain, atau klik 'Ulangi 15 Detik' untuk mendengarkan kembali penjelasan video.";

      if (selectedItem) {
        selectedItem.classList.add('wrong-reveal');
        setTimeout(() => {
          selectedItem.classList.remove('wrong-reveal');
        }, 1000);
      }
    }

    if (window.lucide) lucide.createIcons();
  }

  function ivRewind(seconds = 15) {
    const cp = ivActiveCp || ivLastCp;
    const targetSec = cp ? Math.max(0, cp.detik - seconds) : 0;

    // Tutup modal kuis
    const modal = document.getElementById('ivQuizModal');
    if (modal) modal.style.display = 'none';

    const blocker = document.getElementById('ivClickBlocker');
    if (blocker) blocker.style.display = 'none';

    ivActiveCp = null;

    // Rewind video dan putar kembali
    if (ivPlayer && typeof ivPlayer.seekTo === 'function') {
      try {
        ivPlayer.seekTo(targetSec, true);
        if (typeof ivPlayer.playVideo === 'function') {
          ivPlayer.playVideo();
        }
      } catch(e){}
    }
    startIvTracking();
    showIvToast(`⏪ Memutar ulang penjelasan mulai detik ke-${Math.round(targetSec)}...`);
  }

  function ivResumeVideo() {
    const cp = ivActiveCp || ivLastCp;
    const nextSec = cp ? (cp.detik + 1.2) : 0; // Lewati sedikit dari detik soal agar tidak langsung terpicu ulang

    // Tutup modal
    const modal = document.getElementById('ivQuizModal');
    if (modal) modal.style.display = 'none';

    const blocker = document.getElementById('ivClickBlocker');
    if (blocker) blocker.style.display = 'none';

    ivActiveCp = null;

    if (ivPlayer && typeof ivPlayer.seekTo === 'function') {
      try {
        ivPlayer.seekTo(nextSec, true);
        if (typeof ivPlayer.playVideo === 'function') {
          ivPlayer.playVideo();
        }
      } catch(e){}
    }
    startIvTracking();
  }

  // Bind ke window secara eksplisit
  window.ivSelectOption = ivSelectOption;
  window.ivCheckAnswer = ivCheckAnswer;
  window.ivRewind = ivRewind;
  window.ivResumeVideo = ivResumeVideo;

  async function loadMateri() {
    const titleEl = document.getElementById("displayJudul");
    const container = document.getElementById("materiList");
    const midTarget = getParam("id");

    function renderMateriItem(m) {
      if (!m) return;
      titleEl.innerText = m.judul || m.Judul || "Materi Pembelajaran";

      let link = (m.link || m.Link || "").toString().trim();
      let embed = "";

      // Cek apakah materi memiliki kuis video interaktif
      let kuisRaw = getVal(m, ['kuis_video', 'kuisvideo', 'interaktif', 'soal_video', 'soalvideo']);
      let kuisList = [];
      if (kuisRaw) {
        try {
          kuisList = typeof kuisRaw === 'string' ? JSON.parse(kuisRaw) : kuisRaw;
          if (!Array.isArray(kuisList)) kuisList = [];
        } catch(e) {
          console.error("Gagal parse kuis_video:", e);
          kuisList = [];
        }
      }

      const ytId = extractYouTubeId(link);
      if (ytId && kuisList.length > 0) {
        renderInteractiveYouTube(m, ytId, kuisList);
        logMateriProgress(midTarget);
        return;
      }

      if (link.includes("youtube.com") || link.includes("youtu.be")) {
        let id = ytId || (link.includes("watch?v=") ? link.split("v=")[1].split("&")[0] : link.split("youtu.be/")[1]);
        embed = `<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`;
      } 
      else if (link.includes("docs.google.com/presentation")) {
        let embedUrl = link;
        if (link.includes("/pub")) {
          embedUrl = link.replace("/pub", "/embed");
        } else if (link.includes("/edit")) {
          embedUrl = link.replace(/\/edit.*$/, "/embed");
        } else if (!link.includes("/embed")) {
          let match = link.match(/[-\w]{25,}/);
          if (match) {
            embedUrl = `https://docs.google.com/presentation/d/${match[0]}/embed`;
          }
        }
        
        try {
          let urlObj = new URL(embedUrl);
          urlObj.searchParams.set("start", "false");
          urlObj.searchParams.delete("delayms");
          embedUrl = urlObj.toString();
        } catch (e) {
          if (embedUrl.includes("?")) {
            embedUrl = embedUrl.replace(/start=true/g, "start=false").replace(/delayms=\d+/g, "");
          } else {
            embedUrl += "?start=false";
          }
        }
        embed = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
      }
      else if (link.includes("drive.google.com")) {
        let match = link.match(/[-\w]{25,}/);
        if (match) {
            let fileId = match[0];
            embed = `<iframe src="https://drive.google.com/file/d/${fileId}/preview#toolbar=0&navpanes=0&scrollbar=0"></iframe>`;
        }
      } 
      else if (link.toLowerCase().includes(".pdf")) {
        embed = `<iframe src="${link}#toolbar=0"></iframe>`;
      }

      const isPDF = link.includes("drive.google.com") || link.toLowerCase().includes(".pdf");

      if (embed) {
        container.innerHTML = `
          <div id="iframeLoader" class="loader-container" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); z-index: 110; transition: opacity 0.3s ease;">
            <div class="loader"></div>
            <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Menyiapkan Dokumen...</div>
          </div>
        `;
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = embed;
        const iframe = tempDiv.firstChild;
        iframe.style.position = 'absolute';
        iframe.style.left = '0';
        iframe.style.width = '100%';
        iframe.style.border = 'none';
        iframe.style.background = 'var(--bg-color)';
        iframe.style.opacity = '0';
        iframe.style.transition = 'opacity 0.4s ease-in-out';
        iframe.style.zIndex = '1';

        if (isPDF) {
          iframe.setAttribute('scrolling', 'yes');
          iframe.style.top = '-50px';
          iframe.style.height = 'calc(100% + 50px)';
          iframe.style.pointerEvents = 'auto';
          iframe.style.touchAction = 'pan-y';
        } else {
          iframe.style.top = '0';
          iframe.style.height = '100%';
          iframe.style.pointerEvents = 'auto';
        }
        
        iframe.onload = () => {
          iframe.style.opacity = '1';
          const loader = document.getElementById('iframeLoader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => { if (loader) loader.style.display = 'none'; }, 300);
          }
        };
        container.appendChild(iframe);

        // Pelindung Permanen Header Atas Google Drive (Blokir Tombol Pop-Out / Open in New Tab)
        if (isPDF) {
          const topShield = document.createElement('div');
          topShield.id = 'topShieldOverlay';
          topShield.style.position = 'absolute';
          topShield.style.top = '0';
          topShield.style.left = '0';
          topShield.style.right = '0';
          topShield.style.height = '50px';
          topShield.style.zIndex = '100';
          topShield.style.background = 'rgba(255,255,255,0.001)';
          topShield.style.touchAction = 'pan-y';
          topShield.oncontextmenu = (e) => { e.preventDefault(); return false; };
          topShield.onselectstart = (e) => { e.preventDefault(); return false; };
          topShield.ondragstart = (e) => { e.preventDefault(); return false; };
          topShield.onmousedown = (e) => { e.preventDefault(); return false; };
          topShield.ontouchstart = (e) => {
            // Mencegah mousedown pada tombol popout tapi mengizinkan touch swipe vertical
          };
          container.appendChild(topShield);
        }
      } else {
        container.innerHTML = `<div class="loader-container"><a href="${link}" target="_blank" style="display:inline-block; padding:10px 20px; background:var(--primary); color:white; border-radius:8px; text-decoration:none; font-weight:600;">Buka Materi di Tab Baru</a></div>`;
      }

      logMateriProgress(midTarget);
    }

    // 1. Coba muat instan dari cache localStorage jika tersedia (0ms Flash-Free)
    const cachedStr = localStorage.getItem("cache_materi");
    let hasLoadedFromCache = false;
    if (cachedStr) {
      try {
        const cachedData = JSON.parse(cachedStr);
        let mCached = cachedData.find(item => {
          let mid = (getVal(item, ['id_materi', 'idmateri', 'id']) || item.rowNumber).toString().trim();
          return mid === midTarget;
        });
        if (mCached) {
          renderMateriItem(mCached);
          hasLoadedFromCache = true;
        }
      } catch (e) {}
    }

    // 2. Fetch data terbaru dari server
    try {
      const res = await fetch(API_URL);
      const data = await res.json();

      let m = data.find(item => {
          let mid = (getVal(item, ['id_materi', 'idmateri', 'id']) || item.rowNumber).toString().trim();
          return mid === midTarget;
      });

      if (!midTarget || !m) {
        if (!hasLoadedFromCache) {
          titleEl.innerText = "Error";
          container.innerHTML = '<div class="loader-container"><p style="color:var(--text-muted)">Materi tidak ditemukan</p></div>';
        }
        return;
      }

      if (!hasLoadedFromCache) {
        renderMateriItem(m);
      }

    } catch (e) {
      if (!hasLoadedFromCache) {
        titleEl.innerText = "Error";
        container.innerHTML = '<div class="loader-container"><p style="color:var(--text-muted)">Gagal memuat data</p></div>';
      }
    }
  }

  // Proteksi Anti-Copy & Anti-Print
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('copy', e => e.preventDefault());
  document.addEventListener('cut', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());

  document.addEventListener('keydown', e => {
    if (
      (e.ctrlKey && (['c', 'C', 'p', 'P', 's', 'S', 'u', 'U', 'a', 'A'].includes(e.key))) ||
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)))
    ) {
      e.preventDefault();
      return false;
    }
  });

  function back() { window.location.href = "dashboard.html"; }

  function logMateriProgress(idMateri) {
    const userData = JSON.parse(localStorage.getItem('user') || '{}');
    const username = userData.username;
    
    if (username) {
      localStorage.setItem(`opened_materi_${username}_${idMateri}`, "true");
    }
  }

  loadMateri();
</script>
